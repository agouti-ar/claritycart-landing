<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ClarityCart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'brand-bg': '#0B0F19',
                        'brand-surface': '#1A233A',
                        'brand-accent': '#3B82F6',
                        'brand-text': '#F8FAFC',
                        'brand-muted': '#94A3B8'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #F8FAFC; }
        .glass-panel { background: rgba(26, 35, 58, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 glass-panel rounded-2xl relative z-10 mx-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block hover:opacity-90 transition-opacity">
                <h1 class="text-3xl font-bold tracking-tight mb-2">Clarity<span class="text-brand-accent">Cart</span></h1>
            </a>
            <p class="text-brand-muted">Enter your email to receive a password reset link.</p>
        </div>

        <form id="forgot-form" class="space-y-5" novalidate>
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg flex items-center shadow-[0_0_10px_rgba(239,68,68,0.2)] transition-all duration-300">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="error-text"></span>
            </div>
            
            <div id="success-message" class="hidden bg-green-500/10 border border-green-500/50 text-green-400 text-sm p-3 rounded-lg flex items-center shadow-[0_0_10px_rgba(34,197,94,0.2)] transition-all duration-300">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span id="success-text">Check your email for the reset link!</span>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-brand-muted mb-1.5">Email address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="you@company.com">
            </div>

            <button type="submit" id="reset-btn"
                class="w-full py-3 px-4 bg-brand-accent hover:bg-blue-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200">
                Send Reset Link
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-brand-muted">
            Remember your password? <a href="login.html" class="text-brand-accent hover:underline">Back to login</a>
        </p>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://vzmpwstfddznsvypudhj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6bXB3c3RmZGR6bnN2eXB1ZGhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzMyMTksImV4cCI6MjEwNjM0OTIxOX0.Qz0TGEDy1TOekLrqTrfspT8gnnfGy5_BjMtJRlz-PaI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        document.getElementById('forgot-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
            
            const email = document.getElementById('email').value.trim();
            if (!email) return showError('Please enter your email address.');

            const btn = document.getElementById('reset-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                document.getElementById('success-message').classList.remove('hidden');
                document.getElementById('forgot-form').reset();
            } catch (error) {
                showError(error.message);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
