<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony WH-1000XM5 Wireless Headphones</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
            color: #111;
        }

        .price {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        #add-to-cart {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Sony WH-1000XM5 Wireless Headphones</h1>
    <div class="price">$399.00</div>
    <p>Industry-leading noise canceling with two processors and 8 microphones. Up to 30-hour battery life with quick
        charging.</p>

    <!-- Кнопка с id="add-to-cart", под которую крепится виджет -->
    <button id="add-to-cart">Add to Cart</button>

    <!-- Скрипт виджета ClarityCart -->
    <script src="./clarity.js" defer></script>

</html>
