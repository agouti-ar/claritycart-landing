<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClarityCart Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const pwd = prompt("Enter Admin PIN:");
        if(pwd !== "7777") { document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20%'>Access Denied</h1>"; }
    </script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8">ClarityCart Admin</h1>
        <div class="bg-gray-800 rounded-lg shadow overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-700 text-gray-300 text-sm uppercase">
                        <th class="px-6 py-4 border-b border-gray-600">Email</th>
                        <th class="px-6 py-4 border-b border-gray-600">Domain</th>
                        <th class="px-6 py-4 border-b border-gray-600">Tier</th>
                        <th class="px-6 py-4 border-b border-gray-600">Tokens Used</th>
                        <th class="px-6 py-4 border-b border-gray-600">Status</th>
                        <th class="px-6 py-4 border-b border-gray-600 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <tr class="hover:bg-gray-750 transition-colors">
                        <td class="px-6 py-4 border-b border-gray-700">john@example.com</td>
                        <td class="px-6 py-4 border-b border-gray-700">mystore.com</td>
                        <td class="px-6 py-4 border-b border-gray-700">Pro</td>
                        <td class="px-6 py-4 border-b border-gray-700">1,250 / 2,500</td>
                        <td class="px-6 py-4 border-b border-gray-700"><span class="bg-green-500/20 text-green-400 px-2 py-1 rounded">Active</span></td>
                        <td class="px-6 py-4 border-b border-gray-700 text-right space-x-2">
                            <button class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded transition-colors">Add 30 Days</button>
                            <button class="bg-purple-600 hover:bg-purple-500 px-3 py-1 rounded transition-colors">Add 1 Year</button>
                            <button class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded transition-colors">Block</button>
                        </td>
                    </tr>
                    <tr class="hover:bg-gray-750 transition-colors">
                        <td class="px-6 py-4 border-b border-gray-700">sarah@shop.com</td>
                        <td class="px-6 py-4 border-b border-gray-700">shoes.co</td>
                        <td class="px-6 py-4 border-b border-gray-700">Starter</td>
                        <td class="px-6 py-4 border-b border-gray-700">450 / 500</td>
                        <td class="px-6 py-4 border-b border-gray-700"><span class="bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded">Warning</span></td>
                        <td class="px-6 py-4 border-b border-gray-700 text-right space-x-2">
                            <button class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded transition-colors">Add 30 Days</button>
                            <button class="bg-purple-600 hover:bg-purple-500 px-3 py-1 rounded transition-colors">Add 1 Year</button>
                            <button class="bg-red-600 hover:bg-red-500 px-3 py-1 rounded transition-colors">Block</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
