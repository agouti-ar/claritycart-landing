<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ClarityCart</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-bg': '#0B0F19',
                        'brand-surface': '#1A233A',
                        'brand-accent': '#3B82F6',
                        'brand-text': '#F8FAFC',
                        'brand-muted': '#94A3B8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
        }

        .glass-panel {
            background: rgba(26, 35, 58, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(to right, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative overflow-hidden">

    <!-- Background Glows -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 glass-panel rounded-2xl relative z-10 mx-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block hover:opacity-90 transition-opacity">
                <h1 class="text-3xl font-bold tracking-tight mb-2">Clarity<span class="text-brand-accent">Cart</span></h1>
            </a>
            <p class="text-brand-muted">Welcome back! Sign in to your dashboard.</p>
        </div>

        <form id="login-form" class="space-y-5" novalidate>
            <!-- Custom error message container -->
            <div id="error-message" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 text-sm p-3 rounded-lg flex items-center shadow-[0_0_10px_rgba(239,68,68,0.2)] transition-all duration-300">
                <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="error-text"></span>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-brand-muted mb-1.5">Email address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="you@company.com">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-sm font-medium text-brand-muted">Password</label>
                    <a href="forgot-password.html" class="text-xs text-brand-accent hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="login-btn"
                class="w-full py-3 px-4 bg-brand-accent hover:bg-blue-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200 flex items-center justify-center">
                <span id="btn-text">Sign in</span>
            </button>
        </form>

        <div class="mt-6 flex items-center justify-center">
            <div class="border-t border-gray-700 flex-grow"></div>
            <span class="px-3 text-xs text-brand-muted uppercase">or continue with</span>
            <div class="border-t border-gray-700 flex-grow"></div>
        </div>

        <button id="google-login-btn" class="w-full mt-6 py-3 px-4 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-lg border border-gray-700 transition-colors flex items-center justify-center space-x-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Google</span>
        </button>

        <p class="mt-8 text-center text-sm text-brand-muted">
            Don't have an account? <a href="register.html" class="text-brand-accent hover:underline">Start free trial</a>
        </p>
    </div>

    <!-- Linear-Style Minimalist Loading Overlay -->
    <div id="page-loader" class="fixed inset-0 bg-[#0B0F19]/80 backdrop-blur-md z-50 flex flex-col items-center justify-center transition-opacity duration-300 opacity-0 pointer-events-none">
        <div class="relative flex items-center justify-center">
            <div class="w-10 h-10 rounded-full border-2 border-blue-500/20 border-t-blue-500 animate-spin"></div>
            <div class="absolute w-2 h-2 rounded-full bg-blue-400 animate-ping"></div>
        </div>
        <p id="loader-status" class="mt-4 text-xs font-medium text-gray-400 tracking-widest uppercase">Connecting...</p>
    </div>

    <script src="auth-flow.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://vzmpwstfddznsvypudhj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6bXB3c3RmZGR6bnN2eXB1ZGhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NzMyMTksImV4cCI6MjEwNjM0OTIxOX0.Qz0TGEDy1TOekLrqTrfspT8gnnfGy5_BjMtJRlz-PaI';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, ClarityAuth.clientOptions);

        function showFullLoader(text = 'Connecting...') {
            const loader = document.getElementById('page-loader');
            const status = document.getElementById('loader-status');
            if (status) status.textContent = text;
            loader.classList.remove('opacity-0', 'pointer-events-none');
            loader.classList.add('opacity-100');
        }

        // Check if user is already logged in (skip if explicitly logged out)
        (async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('logged_out') === 'true') {
                try {
                    await supabaseClient.auth.signOut();
                } catch (e) {}
                localStorage.clear();
                sessionStorage.clear();
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    showFullLoader('Redirecting to dashboard...');
                    setTimeout(() => { window.location.href = new URLSearchParams(location.search).get('next') === 'test' ? 'test.html' : 'onboarding.html?manage=1'; }, 300);
                }
            } catch (e) {}
        })();

        function showError(message) {
            const errorBox = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            if (message.includes("Invalid login credentials")) {
                message = "Invalid email or password.";
            }
            errorText.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            const errorBox = document.getElementById('error-message');
            errorBox.classList.add('hidden');
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email) {
                return showError('Please enter your email address.');
            }
            if (!password) {
                return showError('Please enter your password.');
            }

            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            btnText.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Signing in...
            `;
            btn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) throw error;

                // Успешно! Smooth Linear-style transition
                showFullLoader('Welcome back! Loading dashboard...');
                setTimeout(() => {
                    window.location.href = new URLSearchParams(location.search).get('next') === 'test' ? 'test.html' : 'onboarding.html?manage=1';
                }, 400);
                
            } catch (error) {
                showError(error.message);
                btnText.textContent = 'Sign in';
                btn.disabled = false;
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', async function() {
            if (this.disabled) return;
            this.disabled = true;
            hideError();
            showFullLoader('Connecting with Google...');
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: ClarityAuth.callbackUrl(window.location.origin) + (new URLSearchParams(location.search).get('next') === 'test' ? '?next=test' : '')
                    }
                });
                if (error) throw error;
            } catch (error) {
                this.disabled = false;
                showError("Google login error: " + error.message);
                const loader = document.getElementById('page-loader');
                loader.classList.add('opacity-0', 'pointer-events-none');
                loader.classList.remove('opacity-100');
            }
        });
    </script>
</body>
</html>
