<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Free Trial - ClarityCart</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'brand-bg': '#0B0F19',
                        'brand-surface': '#1A233A',
                        'brand-accent': '#3B82F6',
                        'brand-text': '#F8FAFC',
                        'brand-muted': '#94A3B8'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0F19;
            color: #F8FAFC;
        }

        .glass-panel {
            background: rgba(26, 35, 58, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(to right, #3B82F6, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Background Glows -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md p-8 glass-panel rounded-2xl relative z-10 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2 flex items-center justify-center">
                <div class="w-10 h-10 rounded bg-gradient-to-br from-brand-accent to-purple-600 flex items-center justify-center text-white font-bold text-2xl mr-3 shadow-[0_0_15px_rgba(59,130,246,0.5)]">C</div>
                <span class="text-slate-100">Clarity</span><span class="text-brand-accent">Cart</span>
            </h1>
            <p class="text-brand-muted">Start your 7-day free trial. No credit card required.</p>
        </div>

        <form id="register-form" class="space-y-5">
            <div>
                <label for="store_domain" class="block text-sm font-medium text-brand-muted mb-1.5">Store Domain</label>
                <input type="text" id="store_domain" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="mystore.com">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-brand-muted mb-1.5">Email address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="you@company.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-brand-muted mb-1.5">Create Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 rounded-lg bg-gray-900/50 border border-gray-700 text-white focus:outline-none focus:border-brand-accent focus:ring-1 focus:ring-brand-accent transition-colors"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="register-btn"
                class="w-full py-3 px-4 bg-brand-accent hover:bg-blue-600 text-white font-semibold rounded-lg shadow-lg hover:shadow-blue-500/30 transition-all duration-200">
                Create Account
            </button>
        </form>

        <div class="mt-6 flex items-center justify-center">
            <div class="border-t border-gray-700 flex-grow"></div>
            <span class="px-3 text-xs text-brand-muted uppercase">or sign up with</span>
            <div class="border-t border-gray-700 flex-grow"></div>
        </div>

        <button class="w-full mt-6 py-3 px-4 bg-gray-800 hover:bg-gray-700 text-white font-medium rounded-lg border border-gray-700 transition-colors flex items-center justify-center space-x-2">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Google</span>
        </button>

        <p class="mt-8 text-center text-sm text-brand-muted">
            Already have an account? <a href="login.html" class="text-brand-accent hover:underline">Log in</a>
        </p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('register-btn');
            btn.textContent = 'Creating account...';
            btn.disabled = true;
            
            // В будущем здесь будет код подключения к Supabase Auth.
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>
</html>
